name: Build Universal Loader

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-loader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UniversalLoader
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap vendored runtime
        shell: bash
        run: |
          set -e
          if [ ! -f .runtime-vendored ]; then
            rm -rf /tmp/universal-loader-base
            git clone --depth=1 https://github.com/jaowzin/Loader.git /tmp/universal-loader-base
            python3 tools/bootstrap_runtime.py
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: Verify universal runtime exclusions
        shell: bash
        run: |
          set -e
          test -f .runtime-vendored
          test ! -f runtime-core/src/main/cpp/Hook/CarromAimHook.cpp
          test ! -f runtime-core/src/main/cpp/Utils/AntiDetection.cpp
          test ! -f runtime-core/src/main/cpp/Utils/VirtualSpoof.cpp
          ! grep -q 'Hook/CarromAimHook.cpp' runtime-core/src/main/cpp/Android.mk
          ! grep -q 'Utils/AntiDetection.cpp' runtime-core/src/main/cpp/Android.mk
          ! grep -q 'Utils/VirtualSpoof.cpp' runtime-core/src/main/cpp/Android.mk

      - name: Recalibrate Carrom CTF vision
        shell: bash
        run: python3 tools/recalibrate_carrom_vision.py

      - name: Build floating menu sample plugin
        shell: bash
        run: |
          set -e
          NDK="$ANDROID_SDK_ROOT/ndk/29.0.13846066"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          mkdir -p sample-plugins/floating-menu/out/arm64-v8a
          "$CLANG" \
            -shared \
            -fPIC \
            -fvisibility=hidden \
            -O2 \
            -std=c++17 \
            sample-plugins/floating-menu/floating_menu.cpp \
            -o sample-plugins/floating-menu/out/arm64-v8a/libul_floating_menu.so
          file sample-plugins/floating-menu/out/arm64-v8a/libul_floating_menu.so

      - name: Build Carrom CTF trajectory plugin
        shell: bash
        run: |
          set -e
          NDK="$ANDROID_SDK_ROOT/ndk/29.0.13846066"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          mkdir -p sample-plugins/carrom-ctf/out/arm64-v8a
          "$CLANG" \
            -shared \
            -fPIC \
            -fvisibility=hidden \
            -O2 \
            -std=c++17 \
            -I runtime-core/src/main/cpp \
            sample-plugins/carrom-ctf/carrom_ctf.cpp \
            runtime-core/src/main/cpp/Dobby/arm64-v8a/libdobby.a \
            -llog -ldl \
            -Wl,--exclude-libs,ALL \
            -o sample-plugins/carrom-ctf/out/arm64-v8a/libul_carrom_ctf.so
          file sample-plugins/carrom-ctf/out/arm64-v8a/libul_carrom_ctf.so

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit vendored runtime
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Vendor universal runtime [skip ci]'
            git push origin HEAD:main
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalLoader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload floating menu plugin
        uses: actions/upload-artifact@v4
        with:
          name: ULFloatingMenu-arm64-v8a
          path: sample-plugins/floating-menu/out/arm64-v8a/libul_floating_menu.so
          if-no-files-found: error

      - name: Upload Carrom CTF plugin
        uses: actions/upload-artifact@v4
        with:
          name: ULCarromCTF-arm64-v8a
          path: sample-plugins/carrom-ctf/out/arm64-v8a/libul_carrom_ctf.so
          if-no-files-found: error
